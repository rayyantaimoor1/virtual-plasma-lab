# SEC-1: accept connections from this computer only, so measured data is not exposed on a network.
[server]
address = "127.0.0.1"
port = 8501
# FR10.1: the same 50 MB limit as envelope.toml (data.import_max_file_mb); the parser checks it again.
maxUploadSize = 50

# SEC-5: the application makes no outbound network connection at run time.
[browser]
serverAddress = "localhost"
gatherUsageStats = false

# USE-5 (Phase 15): Streamlit's default primary red (#FF4B4B) gives white button text only 3.3:1 contrast.
# This darker red gives 6.6:1 (WCAG asks for at least 4.5:1). It is set for the light and the dark theme separately:
# a plain [theme] section would turn off the automatic dark theme (found in the Phase 15 browser check).
[theme.light]
primaryColor = "#B71C1C"

[theme.dark]
primaryColor = "#B71C1C"
